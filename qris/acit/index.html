<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QRIS | Acitya</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #f9f9f9;
        --surface: #ffffff;
        --text-main: #000000;
        --text-muted: #666666;
        --border: #e5e5e5;
        --border-focus: #000000;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg);
        color: var(--text-main);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        line-height: 1.5;
      }

      .container {
        background: var(--surface);
        width: 100%;
        max-width: 400px;
        padding: 40px 30px;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        border: 1px solid var(--border);
      }

      .merchant-info {
        text-align: center;
        margin-bottom: 32px;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--border);
      }

      .merchant-info h2 {
        font-size: 1.5rem;
        font-weight: 500;
        letter-spacing: -0.03em;
      }

      .merchant-info p {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-top: 4px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .form-group {
        margin-bottom: 24px;
      }

      label {
        display: block;
        font-size: 0.75rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 8px;
        color: var(--text-muted);
      }

      input {
        width: 100%;
        padding: 14px 0;
        border: none;
        border-bottom: 1px solid var(--border);
        font-size: 1.5rem;
        font-weight: 400;
        color: var(--text-main);
        background-color: transparent;
        transition: all 0.3s ease;
        font-family: inherit;
        text-align: center;
      }

      input::placeholder {
        color: #cccccc;
      }

      input:focus {
        outline: none;
        border-bottom-color: var(--border-focus);
      }

      .btn-submit {
        width: 100%;
        padding: 16px;
        background: var(--text-main);
        color: var(--surface);
        border: none;
        font-size: 0.85rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        cursor: pointer;
        margin-top: 8px;
        border-radius: 4px;
        transition:
          background 0.3s ease,
          transform 0.1s ease;
      }

      .btn-submit:hover {
        background: #333333;
      }

      .btn-submit:active {
        transform: scale(0.98);
      }

      .result {
        text-align: center;
        display: none;
        animation: fadeIn 0.5s ease;
      }

      .result.active {
        display: block;
      }

      .qr-container {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
        background: var(--surface);
        border: 1px solid var(--border);
        margin: 0 auto 20px auto;
        width: fit-content;
        border-radius: 8px;
      }

      .display-nominal {
        font-size: 1.75rem;
        font-weight: 600;
        margin-bottom: 32px;
        color: var(--text-main);
      }

      .action-buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .btn-action {
        width: 100%;
        padding: 14px;
        border: none;
        font-size: 0.85rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        cursor: pointer;
        border-radius: 4px;
        transition:
          background 0.3s ease,
          transform 0.1s ease;
      }

      .btn-action:active {
        transform: scale(0.98);
      }

      #btnDownload {
        background: var(--text-main);
        color: var(--surface);
      }

      #btnDownload:hover {
        background: #333333;
      }

      #btnBack {
        background: transparent;
        color: var(--text-main);
        border: 1px solid var(--border);
      }

      #btnBack:hover {
        background: #f0f0f0;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="merchantInfo" class="merchant-info">
        <!-- Info merchant otomatis dirender di sini -->
        <h2>TOKO SAYA</h2>
        <p>Lokasi Toko</p>
      </div>

      <!-- Form Input Nominal -->
      <form id="qrisForm">
        <div class="form-group">
          <label for="amountInput">Nominal Pembayaran (Rp)</label>
          <input
            type="text"
            id="amountInput"
            placeholder="0"
            required
            autocomplete="off"
          />
          <input type="hidden" id="realAmountInput" />
        </div>

        <button type="submit" class="btn-submit">Generate QR</button>
      </form>

      <!-- Hasil Generate (QR & Tombol) -->
      <div class="result" id="resultContainer">
        <div class="qr-container" id="qrcode"></div>
        <div id="displayNominal" class="display-nominal">Rp 0</div>

        <div class="action-buttons">
          <button type="button" id="btnDownload" class="btn-action">
            Download QRIS
          </button>
          <button type="button" id="btnBack" class="btn-action">
            Buat QRIS Baru
          </button>
        </div>
      </div>
    </div>

    <script>
      // ==========================================
      // MASUKKAN STRING QRIS STATIS ANDA DI SINI
      // ==========================================
      const qrisStaticCode =
        "00020101021126570011ID.DANA.WWW011893600915300091615102090009161510303UMI51440014ID.CO.QRIS.WWW0215ID10264871407780303UMI5204549953033605802ID5914Denish Cookies6012Kota Bandung61053097163042BFD";
      // ==========================================

      const qrisForm = document.getElementById("qrisForm");
      const amountInput = document.getElementById("amountInput");
      const realAmountInput = document.getElementById("realAmountInput");
      const qrcodeElement = document.getElementById("qrcode");
      const merchantInfoElement = document.getElementById("merchantInfo");
      const resultContainer = document.getElementById("resultContainer");
      const displayNominal = document.getElementById("displayNominal");
      const btnDownload = document.getElementById("btnDownload");
      const btnBack = document.getElementById("btnBack");

      // Inisialisasi tampilan awal info merchant
      if (
        qrisStaticCode &&
        qrisStaticCode.length > 20 &&
        qrisStaticCode !== "ISI_DENGAN_STRING_QRIS_ANDA"
      ) {
        displayMerchantInfo(qrisStaticCode);
      } else {
        merchantInfoElement.innerHTML = `
        <h2 style="color: #000; font-size: 1rem;">Setup Diperlukan</h2>
        <p style="color: #666; text-transform: none; margin-top: 10px;">
          Masukkan string teks QRIS statis Anda ke dalam variabel <code>qrisStaticCode</code>.
        </p>`;
      }

      // Format input menjadi rupiah
      amountInput.addEventListener("input", formatAmountInput);
      amountInput.addEventListener("blur", handleEmptyAmountInput);

      // Submit form untuk generate QR
      qrisForm.addEventListener("submit", handleFormSubmit);

      // Tombol Kembali
      btnBack.addEventListener("click", function () {
        resultContainer.classList.remove("active");
        qrisForm.style.display = "block";
        amountInput.value = "";
        realAmountInput.value = 0;
        amountInput.focus();
      });

      // Tombol Download
      btnDownload.addEventListener("click", function () {
        const canvas = qrcodeElement.querySelector("canvas");
        if (canvas) {
          const url = canvas.toDataURL("image/png");
          const a = document.createElement("a");
          a.href = url;
          // Nama file berdasarkan nominal
          a.download = `QRIS-${realAmountInput.value}.png`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        } else {
          alert("QR Code belum siap, silakan coba lagi.");
        }
      });

      function formatAmountInput(e) {
        let value = e.target.value.replace(/[^\d]/g, "");
        if (value !== "") {
          e.target.value = formatRupiah(value);
          realAmountInput.value = value;
        } else {
          realAmountInput.value = 0;
          e.target.value = "";
        }
      }

      function handleEmptyAmountInput(e) {
        const value = e.target.value;
        if (!value || value === "0") {
          e.target.value = "";
          realAmountInput.value = 0;
        }
      }

      function handleFormSubmit(e) {
        e.preventDefault();

        if (
          !qrisStaticCode ||
          qrisStaticCode === "ISI_DENGAN_STRING_QRIS_ANDA"
        ) {
          alert("String QRIS belum disetel dalam kode sumber.");
          return;
        }

        const nominal = realAmountInput.value.trim();
        if (!nominal || nominal === "0") {
          alert("Silakan masukkan nominal pembayaran.");
          return;
        }

        // Hide form & set nominal text
        qrisForm.style.display = "none";
        displayNominal.innerText = `Rp ${formatRupiah(nominal)}`;

        const dynamicQRIS = convertToDynamicQRIS(qrisStaticCode, nominal);
        displayResult(dynamicQRIS);
      }

      // Mengubah statis menjadi dinamis beserta nominalnya
      function convertToDynamicQRIS(qris, nominal) {
        qris = qris.slice(0, -4).replace("010211", "010212");
        const parts = qris.split("5802ID");

        if (parts.length < 2) return qris;

        const prefix = parts[0];
        const suffix = parts[1];
        const nominalData =
          "54" + String(nominal.length).padStart(2, "0") + nominal;

        const resultQRIS = `${prefix}${nominalData}5802ID${suffix}${convertCRC16(prefix + nominalData + "5802ID" + suffix)}`;
        return resultQRIS;
      }

      // Kalkulasi Checksum CRC16 untuk QRIS
      function convertCRC16(str) {
        let crc = 0xffff;
        for (let c = 0; c < str.length; c++) {
          crc ^= str.charCodeAt(c) << 8;
          for (let i = 0; i < 8; i++) {
            crc = crc & 0x8000 ? (crc << 1) ^ 0x1021 : crc << 1;
          }
        }
        return (crc & 0xffff).toString(16).toUpperCase().padStart(4, "0");
      }

      // Menampilkan QR Code
      function displayResult(dynamicQRIS) {
        qrcodeElement.innerHTML = "";
        new QRCode(qrcodeElement, {
          text: dynamicQRIS,
          width: 220,
          height: 220,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M,
        });
        resultContainer.classList.add("active");
      }

      // Ekstrak nama dan kota merchant dari string QRIS
      function extractMerchantInfo(qrisCode) {
        const merchantNameRegex = /59(\d{2})([^\d]{2,})/;
        const merchantLocationRegex = /60(\d{2})([^\d]{2,})/;

        const nameMatch = qrisCode.match(merchantNameRegex);
        const locationMatch = qrisCode.match(merchantLocationRegex);

        const merchantName = nameMatch
          ? nameMatch[2].substring(0, parseInt(nameMatch[1], 10))
          : "Nama Merchant";
        const merchantLocation = locationMatch
          ? locationMatch[2].substring(0, parseInt(locationMatch[1], 10))
          : "Lokasi Merchant";

        return { name: merchantName, location: merchantLocation };
      }

      // Update UI dengan info merchant dari string
      function displayMerchantInfo(qrisCode) {
        const merchantInfo = extractMerchantInfo(qrisCode);
        merchantInfoElement.innerHTML = `
        <h2>${merchantInfo.name}</h2>
        <p>${merchantInfo.location}</p>
      `;
      }

      function formatRupiah(number) {
        return new Intl.NumberFormat("id-ID").format(number);
      }
    </script>
  </body>
</html>
